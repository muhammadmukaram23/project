<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenAuth - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#44b50c',
                        'primary-dark': '#3a9a0a',
                        'primary-light': '#5cc916',
                        'primary-50': '#f0fcec',
                        'primary-100': '#dcf7d0',
                        'primary-200': '#bef0a6',
                        'primary-500': '#44b50c',
                        'primary-600': '#3a9a0a',
                        'primary-700': '#2f7f08'
                    },
                    fontFamily: {
                        'urbanist': ['Urbanist', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-urbanist bg-gradient-to-br from-primary-50 to-white min-h-screen flex items-center justify-center p-4">
    
    <!-- Background Decoration -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute -top-10 -right-10 w-72 h-72 bg-primary-100 rounded-full opacity-50 blur-3xl"></div>
        <div class="absolute -bottom-10 -left-10 w-96 h-96 bg-primary-50 rounded-full opacity-50 blur-3xl"></div>
        <div class="absolute top-1/2 left-1/4 w-32 h-32 bg-primary-200 rounded-full opacity-30 blur-2xl"></div>
        <div class="absolute top-1/4 right-1/3 w-24 h-24 bg-primary-100 rounded-full opacity-40 blur-xl"></div>
    </div>

    <!-- Main Container -->
    <div class="relative w-full max-w-md">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-2xl mb-4 shadow-lg">
                <i data-feather="user-plus" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-900">Create Account</h1>
            <p class="text-gray-600 mt-2">Join us today and get started</p>
        </div>

        <!-- Register Container -->
        <div class="bg-white rounded-3xl shadow-2xl p-8 backdrop-blur-lg border border-white/20">
            
            <!-- Register Form -->
            <form id="registerForm" class="space-y-6">
                
                <!-- Full Name Field -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-feather="user" class="w-5 h-5 text-gray-400 group-focus-within:text-primary transition-colors"></i>
                        </div>
                        <input type="text" name="fullName" required class="w-full pl-12 pr-4 py-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300 bg-gray-50 focus:bg-white" placeholder="Enter your full name">
                    </div>
                </div>

                <!-- Email Field -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-feather="mail" class="w-5 h-5 text-gray-400 group-focus-within:text-primary transition-colors"></i>
                        </div>
                        <input type="email" name="email" required class="w-full pl-12 pr-4 py-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300 bg-gray-50 focus:bg-white" placeholder="Enter your email">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-feather="lock" class="w-5 h-5 text-gray-400 group-focus-within:text-primary transition-colors"></i>
                        </div>
                        <input type="password" id="registerPassword" name="password" required class="w-full pl-12 pr-12 py-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300 bg-gray-50 focus:bg-white" placeholder="Create a password">
                        <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center" onclick="togglePassword('registerPassword')">
                            <i data-feather="eye" class="w-5 h-5 text-gray-400 hover:text-primary transition-colors"></i>
                        </button>
                    </div>
                    <!-- Password Strength Indicator -->
                    <div class="mt-2">
                        <div class="flex space-x-1">
                            <div id="strength-1" class="h-2 w-full bg-gray-200 rounded-full transition-colors"></div>
                            <div id="strength-2" class="h-2 w-full bg-gray-200 rounded-full transition-colors"></div>
                            <div id="strength-3" class="h-2 w-full bg-gray-200 rounded-full transition-colors"></div>
                            <div id="strength-4" class="h-2 w-full bg-gray-200 rounded-full transition-colors"></div>
                        </div>
                        <p id="strength-text" class="text-sm text-gray-500 mt-1">Password strength</p>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-feather="shield" class="w-5 h-5 text-gray-400 group-focus-within:text-primary transition-colors"></i>
                        </div>
                        <input type="password" id="confirmPassword" name="confirmPassword" required class="w-full pl-12 pr-12 py-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300 bg-gray-50 focus:bg-white" placeholder="Confirm your password">
                        <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center" onclick="togglePassword('confirmPassword')">
                            <i data-feather="eye" class="w-5 h-5 text-gray-400 hover:text-primary transition-colors"></i>
                        </button>
                    </div>
                    <div id="password-match" class="mt-2 text-sm hidden">
                        <span id="match-indicator" class="flex items-center">
                            <i data-feather="check-circle" class="w-4 h-4 mr-1"></i>
                            <span id="match-text">Passwords match</span>
                        </span>
                    </div>
                </div>

                <!-- Terms & Conditions -->
                <div class="flex items-start">
                    <input type="checkbox" id="terms" name="terms" required class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary mt-1">
                    <span class="ml-3 text-sm text-gray-600">
                        I agree to the 
                        <a href="#" class="text-primary hover:text-primary-dark font-semibold transition-colors">Terms of Service</a> 
                        and 
                        <a href="#" class="text-primary hover:text-primary-dark font-semibold transition-colors">Privacy Policy</a>
                    </span>
                </div>

                <!-- Newsletter Subscription -->
                <div class="flex items-start">
                    <input type="checkbox" id="newsletter" name="newsletter" class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary mt-1">
                    <span class="ml-3 text-sm text-gray-600">
                        Subscribe to our newsletter for updates and exclusive offers
                    </span>
                </div>

                <!-- Register Button -->
                <button type="submit" class="w-full bg-primary text-white py-4 rounded-xl font-semibold hover:bg-primary-dark transition-all duration-300 transform hover:scale-[1.02] shadow-lg hover:shadow-xl flex items-center justify-center group">
                    <i data-feather="user-plus" class="w-5 h-5 mr-2 group-hover:scale-110 transition-transform"></i>
                    Create Account
                </button>

                <!-- Social Register -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-500">Or register with</span>
                    </div>
                </div>

                

                <!-- Login Link -->
                <div class="text-center mt-8">
                    <p class="text-gray-600">
                        Already have an account? 
                        <a href="login.html" class="text-primary hover:text-primary-dark font-semibold transition-colors">Sign in here</a>
                    </p>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-gray-500 text-sm">
            <p>&copy; 2024 GreenAuth. All rights reserved.</p>
        </div>
    </div>

    <script>
        // Initialize Feather Icons
        feather.replace();

        // Password Toggle
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = field.parentElement.querySelector('button i');
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.setAttribute('data-feather', 'eye-off');
            } else {
                field.type = 'password';
                icon.setAttribute('data-feather', 'eye');
            }
            feather.replace();
        }

        // Password Strength Checker
        function checkPasswordStrength(password) {
            let strength = 0;
            let feedback = [];

            // Length check
            if (password.length >= 8) strength++;
            else feedback.push('At least 8 characters');

            // Uppercase check
            if (/[A-Z]/.test(password)) strength++;
            else feedback.push('One uppercase letter');

            // Lowercase check
            if (/[a-z]/.test(password)) strength++;
            else feedback.push('One lowercase letter');

            // Number or special char check
            if (/[\d\W]/.test(password)) strength++;
            else feedback.push('One number or special character');

            return { strength, feedback };
        }

        // Update password strength indicator
        function updatePasswordStrength() {
            const password = document.getElementById('registerPassword').value;
            const { strength, feedback } = checkPasswordStrength(password);
            const indicators = ['strength-1', 'strength-2', 'strength-3', 'strength-4'];
            const strengthText = document.getElementById('strength-text');

            // Reset indicators
            indicators.forEach(id => {
                document.getElementById(id).className = 'h-2 w-full bg-gray-200 rounded-full transition-colors';
            });

            // Update indicators based on strength
            const colors = ['bg-red-500', 'bg-yellow-500', 'bg-blue-500', 'bg-green-500'];
            const labels = ['Weak', 'Fair', 'Good', 'Strong'];

            for (let i = 0; i < strength; i++) {
                document.getElementById(indicators[i]).className = `h-2 w-full ${colors[strength - 1]} rounded-full transition-colors`;
            }

            if (password.length > 0) {
                strengthText.textContent = `Password strength: ${labels[strength - 1] || 'Very weak'}`;
                strengthText.className = `text-sm mt-1 ${strength >= 3 ? 'text-green-600' : strength >= 2 ? 'text-blue-600' : 'text-red-600'}`;
            } else {
                strengthText.textContent = 'Password strength';
                strengthText.className = 'text-sm text-gray-500 mt-1';
            }
        }

        // Check password match
        function checkPasswordMatch() {
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const matchIndicator = document.getElementById('password-match');
            const matchIcon = matchIndicator.querySelector('i');
            const matchText = document.getElementById('match-text');

            if (confirmPassword.length > 0) {
                matchIndicator.classList.remove('hidden');
                
                if (password === confirmPassword) {
                    matchIcon.setAttribute('data-feather', 'check-circle');
                    matchText.textContent = 'Passwords match';
                    matchIndicator.className = 'mt-2 text-sm text-green-600';
                } else {
                    matchIcon.setAttribute('data-feather', 'x-circle');
                    matchText.textContent = 'Passwords do not match';
                    matchIndicator.className = 'mt-2 text-sm text-red-600';
                }
                feather.replace();
            } else {
                matchIndicator.classList.add('hidden');
            }
        }

        // Event listeners for password fields
        document.getElementById('registerPassword').addEventListener('input', updatePasswordStrength);
        document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);
        document.getElementById('registerPassword').addEventListener('input', checkPasswordMatch);

        // Form Validation and Submission
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Get form data
            const formData = new FormData(e.target);
            const fullName = formData.get('fullName');
            const email = formData.get('email');
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            const terms = formData.get('terms');
            const newsletter = formData.get('newsletter');

            // Validation
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            const { strength } = checkPasswordStrength(password);
            if (strength < 3) {
                alert('Please choose a stronger password!');
                return;
            }

            if (!terms) {
                alert('Please accept the Terms of Service and Privacy Policy');
                return;
            }

            // Show loading state
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalContent = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i data-feather="loader" class="w-5 h-5 mr-2 animate-spin"></i>Creating Account...';
            submitBtn.disabled = true;
            feather.replace();
            
            // Simulate registration process
            setTimeout(() => {
                // Reset button
                submitBtn.innerHTML = originalContent;
                submitBtn.disabled = false;
                feather.replace();
                
                // Here you would typically handle the actual registration
                alert('Account created successfully! (Demo)');
                console.log('Registration data:', { 
                    fullName, 
                    email, 
                    password: '***hidden***', 
                    newsletter: !!newsletter 
                });
            }, 2500);
        });

        // Input Focus Effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.02]');
            });
            
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.02]');
            });
        });

        // Real-time email validation
        document.querySelector('input[type="email"]').addEventListener('input', function(e) {
            const email = e.target.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (email.length > 0 && !emailRegex.test(email)) {
                e.target.style.borderColor = '#ef4444';
            } else {
                e.target.style.borderColor = '';
            }
        });

        // Auto-focus next field on Enter
        document.querySelectorAll('input').forEach((input, index, inputs) => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && index < inputs.length - 1) {
                    e.preventDefault();
                    inputs[index + 1].focus();
                }
            });
        });
    </script>

    <style>
        /* Custom animations */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bg-white {
            animation: slideInUp 0.6s ease-out;
        }

        /* Loading animation */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* Smooth transitions for form elements */
        input:focus {
            transform: translateY(-1px);
        }

        /* Custom checkbox styling */
        input[type="checkbox"]:checked {
            background-color: #44b50c;
            border-color: #44b50c;
        }
    </style>
</body>
</html>
